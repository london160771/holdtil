# Holdtil Scout, once an hour (PRD §16 2026-11-25). Runs only when the owner has added the repo secrets.
# Secrets (repo → Settings → Secrets and variables → Actions → Secrets): SCOUT_PRIVATE_KEY, MONGODB_URI.
# Variable (same page → Variables): SCOUT_MODE=live to pay; anything else = dry run (reads the price only).
# Scout's own guards still apply: Base USDC only, ≤ $0.10 per call, daily budget (default $0.30).
name: scout
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scout
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SECRETS: ${{ secrets.SCOUT_PRIVATE_KEY != '' && secrets.MONGODB_URI != '' }}
    steps:
      - name: Skip when secrets are not set
        if: env.HAS_SECRETS != 'true'
        run: echo "SCOUT_PRIVATE_KEY or MONGODB_URI not set; skipping."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_SECRETS == 'true'
        run: npm ci
      - name: Scout run
        if: env.HAS_SECRETS == 'true'
        env:
          SCOUT_PRIVATE_KEY: ${{ secrets.SCOUT_PRIVATE_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SCOUT_MODE: ${{ vars.SCOUT_MODE }}
          SCOUT_DAILY_MAX_USDC: ${{ vars.SCOUT_DAILY_MAX_USDC }}
        run: npm run scout
